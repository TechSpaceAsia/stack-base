name: Deploy (stack-base)

# Runs the SAME command an operator runs from their own laptop --
# `./infra/up deploy <tag>` (stackbase/release.py) -- over the SAME
# restricted SSH door every `stackbase.deploy.keys` entry uses
# (nixos/deploy/stack-deploy-ssh.sh): upload | deploy | rollback | status |
# colors | releases. This workflow drives that one door with a
# repo-level deploy-key secret (created by `./infra/up --env <env> ci-setup`)
# and nothing else -- it never gets a shell on a server, never touches
# nginx/TLS, and cannot see this project's own secrets (infra/secrets.*.age
# never leave the operator's machine; this workflow never decrypts them).
#
# Staging, then production. A `v*` tag push deploys that tag to STAGING
# with the `STACK_DEPLOY_KEY_STAGING` repo secret and smoke-tests it
# (`./infra/up smoke`). If both succeed AND the tagged commit is on the
# repository's default branch (master), the same tag then deploys to
# PRODUCTION with `STACK_DEPLOY_KEY_PRODUCTION`.
# A tag cut from any other branch stops at staging. Each secret is written
# by `./infra/up --env <env> ci-setup`.
#
# On GitHub Free a private repo has no environment-scoped secrets, so both
# keys are repo secrets: anyone who can push a branch could edit this file
# and read them. What bounds that is the door, not GitHub: a deploy key can
# only upload, deploy or roll back a release (see the restricted SSH door
# above), never get a shell. Promoting by hand still works too:
# `./infra/up --env production deploy <tag>` from an operator's machine.
#
# Nothing is decrypted here, including infra/deploy.<env>.age -- which IS in the
# checkout, because `ci-setup` tells you to commit it. That file is the same
# key, encrypted to the team's age recipients, and the runner holds no age
# identity for it. The workflow therefore writes the plaintext key it was
# handed to a file and exports $STACKBASE_SSH_IDENTITY, which is resolution
# path 1 of `release.deploy_identity` ("an explicit operator choice always
# wins, and nothing is decrypted") -- it takes precedence over the
# deploy.<env>.age path, so the deploy never asks for an age identity the runner
# does not have. See the README's "Deploying from GitHub Actions" section.
#
# `./infra/up deploy` itself builds the static-musl binary, builds the CSS
# bundle, packages a deterministic tarball, then uploads and switches it on
# every node -- replicas first, primary last -- stopping at the first
# failure. It prints each touched node's current release at the end
# (success or failure) on its own, so this workflow adds nothing beyond
# supplying the SSH key and calling it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # One deploy at a time per repo: a second tag pushed while the first is
  # still running queues behind it instead of racing it. The engine itself
  # also holds a per-node flock (exit 3, "another deploy is already in
  # progress") as a second, independent guard -- see
  # nixos/deploy/stack-deploy.sh.
  group: deploy-stack
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  staging:
    # Every tag deploys staging first -- see the header.
    outputs:
      on_default_branch: ${{ steps.branch.outputs.on_default_branch }}
    # A self-hosted runner, not ubuntu-latest: minutes on it are free (it
    # is our own machine), and it is a NixOS box that carries the musl
    # cross compiler and tailwindcss -- so no C toolchain is installed at
    # job time at all. `./infra/up deploy` wires $CC_x86_64_unknown_linux_musl
    # / the cargo linker variable to x86_64-unknown-linux-musl-gcc by itself
    # when it finds it on PATH (stackbase/release.py).
    #
    # The `production` label picks the release runner, which is reserved
    # for tag-driven deploys: it does not carry the `x86_64-linux` label
    # that pull-request CI asks for, so a release never queues behind CI.
    # The runner lives on nixos-ollama; its registration and toolchain are
    # host-level config in platform-base (`services.github-runners
    # .techspace-production` in nixos/nixos-ollama.nix), not in this
    # repository. Both labels must match what that runner registers with.
    # A project that copies this template but has no such runner
    # registered will see every deploy job queue forever with no error --
    # GitHub does not fail a job for want of a matching runner, it just
    # never schedules it. If you don't have this runner, see the README
    # section on deploying from GitHub Actions for the ubuntu-latest
    # fallback.
    runs-on: [self-hosted, production]
    steps:
      # node24 actions throughout: the runner ships only the node24 runtime.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the default-branch check below needs merge-base.
          fetch-depth: 0

      # Runs before anything else that needs a tool: a runner that lacks one
      # (GitHub's ubuntu-latest has rustup but no tailwindcss or musl cross
      # compiler, for instance) fails here in seconds with the full list,
      # instead of halfway through `./infra/up deploy` with a bare "command
      # not found".
      - name: Check the runner has stack-base's tools
        run: |
          missing=()
          for t in python3 rsync tailwindcss x86_64-unknown-linux-musl-gcc rustup git ssh; do
            if ! command -v "$t" >/dev/null 2>&1; then
              missing+=("$t")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::this runner is missing: ${missing[*]} — use the production runner or add them to its extraPackages"
            exit 1
          fi

      - name: Verify the tag matches Cargo.toml's version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # A tag, never a branch that happens to be named like one.
          if ! git show-ref --verify --quiet "refs/tags/$GITHUB_REF_NAME"; then
            echo "ERROR: $GITHUB_REF_NAME is not a tag in this repository"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Is the tagged commit on the default branch?
        id: branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "on_default_branch=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is on $DEFAULT_BRANCH: production follows staging"
          else
            echo "on_default_branch=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH: deploying staging only"
          fi

      - name: Install the musl Rust target
        # The cross COMPILER is part of the runner's own NixOS config; only
        # the Rust target itself is per-job (and a no-op once cached).
        run: rustup target add x86_64-unknown-linux-musl

      # No actions/cache step. On the self-hosted runner $CARGO_HOME lives in
      # the runner's own state directory and persists between jobs, so the
      # registry/git download cache is already warm, and the throwaway
      # `git worktree` that `./infra/up deploy` builds in (release.py's
      # `release_worktree`) means a `target/` cache keyed to this checkout
      # would never be reused anyway. (The runner's built-in hashFiles
      # expression function is also hard-wired to a node20 runtime the
      # runner does not ship, so a cache key built on it fails there.) On
      # the ubuntu-latest fallback, add actions/cache for ~/.cargo/registry
      # and ~/.cargo/git back, keyed on a sha256sum of Cargo.lock from a
      # shell step.

      - name: Write the CI deploy key and point $STACKBASE_SSH_IDENTITY at it
        env:
          # The ONLY secret this job references -- staging's own key. Kept in `env:`, never
          # interpolated directly into a `run:` script line -- GitHub Actions
          # does not shell-escape `${{ }}` expressions, so putting a secret
          # straight into a script is both a leak risk (it can end up in
          # `set -x`/debug output) and an injection risk. `$STACK_DEPLOY_KEY`
          # below is an ordinary environment variable read by the shell, not
          # a template expression.
          STACK_DEPLOY_KEY: ${{ secrets.STACK_DEPLOY_KEY_STAGING }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          # 0600 from the moment it exists, never chmod'ed afterwards: ssh
          # refuses a group/world-readable private key, and a window at a
          # laxer mode is exactly what this avoids. $RUNNER_TEMP is wiped by
          # the runner between jobs; the cleanup step below removes the file
          # explicitly anyway, pass or fail.
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$STACK_DEPLOY_KEY" > "$key_file"
          # Resolution path 1 of release.deploy_identity: an explicit
          # identity wins over infra/deploy.staging.age (which is in this checkout
          # but cannot be decrypted here -- no age identity on the runner)
          # and nothing is decrypted. stackbase/ssh.py reads this variable
          # and offers exactly this one key, with `-o IdentitiesOnly=yes`,
          # so the door's MaxAuthTries/fail2ban surface is a non-issue --
          # no SSH agent is involved at any point.
          echo "STACKBASE_SSH_IDENTITY=$key_file" >> "$GITHUB_ENV"

      - name: Deploy to staging
        run: ./infra/up --env staging deploy "$GITHUB_REF_NAME"

      # Production waits on this job, so a failed smoke test stops the
      # release here. It checks every node serves the tag, the public URL
      # answers, and runs infra/smoke if the project has one.
      - name: Smoke-test staging
        run: ./infra/up --env staging smoke "$GITHUB_REF_NAME"

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"

  production:
    # Only after staging succeeded, and only for a tag on the default branch.
    needs: staging
    if: needs.staging.outputs.on_default_branch == 'true'
    runs-on: [self-hosted, production]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The staging job already checked the tag against Cargo.toml.
      - name: Check the runner has stack-base's tools
        run: |
          missing=()
          for t in python3 rsync tailwindcss x86_64-unknown-linux-musl-gcc rustup git ssh; do
            if ! command -v "$t" >/dev/null 2>&1; then
              missing+=("$t")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::this runner is missing: ${missing[*]} — use the production runner or add them to its extraPackages"
            exit 1
          fi

      - name: Install the musl Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Write the CI deploy key and point $STACKBASE_SSH_IDENTITY at it
        env:
          # The ONLY secret this job references -- production's own key, in
          # `env:` for the same reasons as in the staging job.
          STACK_DEPLOY_KEY: ${{ secrets.STACK_DEPLOY_KEY_PRODUCTION }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$STACK_DEPLOY_KEY" > "$key_file"
          echo "STACKBASE_SSH_IDENTITY=$key_file" >> "$GITHUB_ENV"

      - name: Deploy to production
        run: ./infra/up --env production deploy "$GITHUB_REF_NAME"

      # A failure turns the run red and prints the rollback command; it
      # does not roll back by itself.
      - name: Smoke-test production
        run: ./infra/up --env production smoke "$GITHUB_REF_NAME"

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
