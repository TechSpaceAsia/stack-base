name: Deploy (stack-base)

# Runs the SAME command an operator runs from their own laptop --
# `./infra/up deploy <tag>` (stackbase/release.py) -- over the SAME
# restricted SSH door every `stackbase.deploy.keys` entry uses
# (nixos/deploy/stack-deploy-ssh.sh): upload | deploy | rollback | status |
# colors | releases. This workflow drives that one door with the
# repo-level `STACK_DEPLOY_KEY` secret (created by `./infra/up ci-setup`)
# and nothing else -- it never gets a shell on a server, never touches
# nginx/TLS, and cannot see this project's own secrets (infra/secrets.age
# never leaves the operator's machine; this workflow never decrypts it).
#
# Nothing is decrypted here, including infra/deploy.age -- which IS in the
# checkout, because `ci-setup` tells you to commit it. That file is the same
# key, encrypted to the team's age recipients, and the runner holds no age
# identity for it. The workflow therefore writes the plaintext key it was
# handed to a file and exports $STACKBASE_SSH_IDENTITY, which is resolution
# path 1 of `release.deploy_identity` ("an explicit operator choice always
# wins, and nothing is decrypted") -- it takes precedence over the
# deploy.age path, so the deploy never asks for an age identity the runner
# does not have. See the README's "Deploying from GitHub Actions" section.
#
# `./infra/up deploy` itself builds the static-musl binary, builds the CSS
# bundle, packages a deterministic tarball, then uploads and switches it on
# every node -- replicas first, primary last -- stopping at the first
# failure. It prints each touched node's current release at the end
# (success or failure) on its own, so this workflow adds nothing beyond
# supplying the SSH key and calling it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # One deploy at a time per repo: a second tag pushed while the first is
  # still running queues behind it instead of racing it. The engine itself
  # also holds a per-node flock (exit 3, "another deploy is already in
  # progress") as a second, independent guard -- see
  # nixos/deploy/stack-deploy.sh.
  group: deploy-stack
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    # A self-hosted runner, not ubuntu-latest: minutes on it are free (it
    # is our own machine), and it is a NixOS box that already carries the
    # musl cross compiler and tailwindcss -- so no C toolchain is
    # installed at job time at all. `./infra/up deploy` wires
    # $CC_x86_64_unknown_linux_musl / the cargo linker variable to
    # x86_64-unknown-linux-musl-gcc by itself when it finds it on PATH
    # (stackbase/release.py).
    #
    # The runner lives on nixos-ollama; its registration and toolchain are
    # host-level config in platform-base, not in this repository. Both
    # labels must match what that runner registers with. A project that
    # copies this template but has no such runner registered will see
    # every deploy job queue forever with no error -- GitHub does not fail
    # a job for want of a matching runner, it just never schedules it. If
    # you don't have this runner, see the README section on deploying from
    # GitHub Actions for the ubuntu-latest fallback.
    runs-on: [self-hosted, x86_64-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the tag matches Cargo.toml's version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install the musl Rust target
        # The cross COMPILER is part of the runner's own NixOS config; only
        # the Rust target itself is per-job (and a no-op once cached).
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache the cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Deliberately NOT `target/`: `./infra/up deploy` builds inside its
          # own throwaway `git worktree` (release.py's `release_worktree`, a
          # fresh temp directory every run), so a build-output cache keyed to
          # THIS checkout's own `target/` would never actually be reused --
          # only the registry/git dependency download cache helps here.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Write the CI deploy key and point $STACKBASE_SSH_IDENTITY at it
        env:
          # The ONLY secret this workflow references. Kept in `env:`, never
          # interpolated directly into a `run:` script line -- GitHub Actions
          # does not shell-escape `${{ }}` expressions, so putting a secret
          # straight into a script is both a leak risk (it can end up in
          # `set -x`/debug output) and an injection risk. `$STACK_DEPLOY_KEY`
          # below is an ordinary environment variable read by the shell, not
          # a template expression.
          STACK_DEPLOY_KEY: ${{ secrets.STACK_DEPLOY_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          # 0600 from the moment it exists, never chmod'ed afterwards: ssh
          # refuses a group/world-readable private key, and a window at a
          # laxer mode is exactly what this avoids. $RUNNER_TEMP is wiped by
          # the runner between jobs; the cleanup step below removes the file
          # explicitly anyway, pass or fail.
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$STACK_DEPLOY_KEY" > "$key_file"
          # Resolution path 1 of release.deploy_identity: an explicit
          # identity wins over infra/deploy.age (which is in this checkout
          # but cannot be decrypted here -- no age identity on the runner)
          # and nothing is decrypted. stackbase/ssh.py reads this variable
          # and offers exactly this one key, with `-o IdentitiesOnly=yes`,
          # so the door's MaxAuthTries/fail2ban surface is a non-issue --
          # no SSH agent is involved at any point.
          echo "STACKBASE_SSH_IDENTITY=$key_file" >> "$GITHUB_ENV"

      - name: Deploy
        run: ./infra/up deploy "$GITHUB_REF_NAME"

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
