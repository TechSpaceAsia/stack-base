# A single-environment stack.toml in today's (pre-environments) format.
# tests/test_reconcile.py's LegacyPlanGoldenTests plans it and compares the
# output with tests/fixtures/stack.plan.golden, generated by stack-base
# before environments existed: a legacy project must plan byte-for-byte the
# same after the upgrade.
project    = "acme"
domain     = "acme.example.com"
owner      = "matt"
datacenter = "kul"
plan       = "KVM 1"
price_item = "hostingercom-vps-kvm1-usd-1m"
admins     = ["matt"]

[nodes.a]
role   = "primary"
vps_id = 1984476

[nodes.b]
role = "replica"

[backups]
bucket = "acme-backups"
